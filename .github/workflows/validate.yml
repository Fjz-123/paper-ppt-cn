name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate public package
        run: python3 scripts/validate.py
      - name: Test validator
        run: python3 -m unittest discover -s tests -v
